name: CI

# Runs on every push/PR to main. This site deploys manually (via the Netlify
# CLI/API, not Netlify's git-connected auto-deploy), so this workflow is the
# only thing standing between a broken change and it reaching production --
# nothing here blocks a deploy automatically, so always check this went green
# before deploying.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check HTML structure (single doctype/html/head/body)
        run: python3 scripts/ci/check_html_structure.py

      - name: Check inline <script> syntax
        run: python3 scripts/ci/check_js_syntax.py

      - name: Check data/*.json validity
        run: python3 scripts/ci/check_json.py

      - name: Install Tailwind build tool
        run: npm install

      - name: Verify assets/tailwind.css is in sync with index.html
        run: |
          node scripts/build-tailwind.mjs
          if ! git diff --exit-code assets/tailwind.css; then
            echo ""
            echo "assets/tailwind.css is out of date. Run 'node scripts/build-tailwind.mjs' locally and commit the result."
            exit 1
          fi

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Browser smoke test
        run: python3 scripts/ci/smoke_test.py
